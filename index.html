        }

    window.processTeacherLogin = async () => {
        const email = document.getElementById('t-email').value.trim();
        if (!email) {
            showModal("Ralat", "Sila masukkan e-mel.");
            return;
        }
        State.teacher.email = email;
        
        if (!isFirebaseReady || !auth.currentUser) {
            showModal("Amaran", "Tidak dapat bersambung ke pangkalan data awan.");
            return;
        }

        contentDiv.innerHTML = `<div class="text-school-blue flex flex-col items-center"><i class="fas fa-spinner fa-spin fa-3x mb-4"></i><p>Menyemak pelayan...</p></div>`;
        
        try {
            const q = collection(db, 'artifacts', appId, 'public', 'data', 'scores');
            const snapshot = await getDocs(q);
            let results = [];
            snapshot.forEach((doc) => {
                let data = doc.data();
                if(data.teacherEmail && data.teacherEmail.toLowerCase() === email.toLowerCase()) results.push(data);
            });
            results.sort((a, b) => new Date(b.timestamp) - new Date(a.timestamp));
            renderTeacherDashboard(results);
        } catch (error) {
            showModal("Ralat", "Gagal memuat turun data.");
            renderTeacherLogin();
        }
    };

                rows += `

                        <td class="p-3">${r.studentName} <br><span class="text-xs text-gray-500">${r.className}</span></td>
                        <td class="p-3 font-semibold">${r.level}</td>
                        <td class="p-3 font-bold text-school-blue">${r.score}/${r.total}</td>
                        <td class="p-3 text-sm text-gray-500">${date}</td>
                    </tr>
                `;
            });
        }

        contentDiv.innerHTML = `

                <div class="flex justify-between items-center mb-6">

        State.currentLevel = levelStr;

    window.renderGameplay = function() {
        State.isAnswered = false;
        const questions = QuizData[State.currentLevel];
        const qData = questions[State.currentQIndex];
        const totalQ = questions.length;
        const qNum = State.currentQIndex + 1;

        let optionsHTML = '';
        const labels = ['A', 'B', 'C', 'D'];
        
        qData.options.forEach((opt, idx) => {
            optionsHTML += `
                <button id="opt-${idx}" onclick="window.checkMcqAnswer(${idx})" class="option-btn w-full text-left p-4 rounded-lg bg-gray-50 mb-3 text-gray-800 flex items-start gap-3 shadow-sm">
                    <span class="font-bold bg-white border border-gray-300 rounded w-8 h-8 flex items-center justify-center shrink-0">${labels[idx]}</span>
                    <span class="mt-1">${opt}</span>
                </button>
            `;
        });

        let lvlColor = State.currentLevel === 'Level 1' ? 'text-green-600 bg-green-100' : 
                       State.currentLevel === 'Level 2' ? 'text-blue-600 bg-blue-100' : 'text-red-600 bg-red-100';

        contentDiv.innerHTML = `
            <div class="w-full max-w-2xl fade-in flex flex-col h-full">
                <!-- Status Bar -->
                <div class="flex justify-between items-center mb-4 flex-wrap gap-2">
                    <span class="px-3 py-1 rounded-full text-xs font-bold ${lvlColor} shadow-sm border">${State.currentLevel}</span>
                    <span class="text-sm font-bold text-school-blue bg-blue-50 px-3 py-1 rounded-full border border-blue-100">Soalan: ${qNum} / ${totalQ}</span>
                </div>
                
                <div class="w-full bg-gray-200 rounded-full h-2 mb-4">
                    <div class="bg-school-gold h-2 rounded-full transition-all duration-500" style="width: ${(qNum / totalQ) * 100}%"></div>
                </div>
                
                <!-- Soalan & Label Topik -->
                <div class="mb-4 bg-white p-6 rounded-xl border border-gray-100 shadow-sm relative">
                    <span class="absolute top-0 right-0 bg-blue-500 text-white text-xs px-3 py-1 rounded-bl-lg rounded-tr-xl font-bold">
                        ${qData.bab}
                    </span>
                    <h3 class="text-lg text-gray-800 leading-relaxed mt-4 font-medium">${qData.question}</h3>
                </div>
                
                <!-- Kawasan Pilihan -->
                <div id="input-container" class="mb-2">
                    ${optionsHTML}
                </div>
                
                <!-- Kawasan Penyelesaian -->
                <div id="solution-container" class="hidden mt-auto bg-blue-50 p-5 rounded-xl border border-blue-200 shadow-inner mb-4">
                    <h4 class="font-bold text-school-blue mb-2 flex items-center"><i class="fas fa-laptop-code text-yellow-500 mr-2 fa-lg"></i> Jalan Kira / Konsep:</h4>
                    <p class="text-gray-700 text-sm leading-relaxed" id="solution-text"></p>
                </div>

                <button id="next-btn" onclick="window.nextQuestion()" class="hidden w-full bg-school-blue text-white p-4 rounded-xl font-bold text-lg btn-hover-effect mt-4 shadow-md">
                    Seterusnya <i class="fas fa-arrow-right ml-2"></i>
                </button>
            </div>
        `;
    }

    window.checkMcqAnswer = (selectedIndex) => {
        if (State.isAnswered) return;
        State.isAnswered = true;
        
        const qData = QuizData[State.currentLevel][State.currentQIndex];
        const correctIndex = qData.answerIndex;
        
        for(let i=0; i<4; i++) {
            const btn = document.getElementById(`opt-${i}`);
            btn.disabled = true;
            btn.classList.add('opacity-70', 'cursor-not-allowed');
        }

        const selectedBtn = document.getElementById(`opt-${selectedIndex}`);
        const correctBtn = document.getElementById(`opt-${correctIndex}`);
        
        if (selectedIndex === correctIndex) {
            State.score++;
            selectedBtn.classList.replace('bg-gray-50', 'option-correct');
            selectedBtn.classList.replace('opacity-70', 'opacity-100');
            selectedBtn.querySelector('span:first-child').innerHTML = `<i class="fas fa-check"></i>`;
            selectedBtn.querySelector('span:first-child').classList.replace('bg-white', 'bg-green-200');
            selectedBtn.querySelector('span:first-child').classList.add('text-green-800');
        } else {
            selectedBtn.classList.replace('bg-gray-50', 'option-wrong');
            selectedBtn.classList.replace('opacity-70', 'opacity-100');
            selectedBtn.querySelector('span:first-child').innerHTML = `<i class="fas fa-times"></i>`;
            selectedBtn.querySelector('span:first-child').classList.replace('bg-white', 'bg-red-200');
            selectedBtn.querySelector('span:first-child').classList.add('text-red-800');
            
            correctBtn.classList.replace('bg-gray-50', 'option-correct');
            correctBtn.classList.replace('opacity-70', 'opacity-100');
            correctBtn.classList.add('ring-2', 'ring-green-500');
        }

        // Tunjuk penyelesaian
        const solContainer = document.getElementById('solution-container');
        document.getElementById('solution-text').innerHTML = qData.solution;
        solContainer.classList.remove('hidden');
        solContainer.classList.add('fade-in');

        const nextBtn = document.getElementById('next-btn');
        const totalQ = QuizData[State.currentLevel].length;
        if (State.currentQIndex === totalQ - 1) {
             nextBtn.innerHTML = `Selesai & Lihat Keputusan <i class="fas fa-flag-checkered ml-2"></i>`;
             nextBtn.classList.replace('bg-school-blue', 'bg-school-gold');
        }
        nextBtn.classList.remove('hidden');
    };

    window.nextQuestion = () => {
        const totalQ = QuizData[State.currentLevel].length;
        if (State.currentQIndex < totalQ - 1) {
            State.currentQIndex++;
            renderGameplay();
        } else {
            renderResult();
        }
    };

    async function renderResult() {
        const totalQ = QuizData[State.currentLevel].length;
        const percentage = Math.round((State.score / totalQ) * 100);
        
        let feedbackMsg = percentage >= 80 ? "Hebat! Penguasaan Tingkatan 5 yang cemerlang." : 
                          percentage >= 50 ? "Sederhana. Teruskan buat ulang kaji." : 
                                             "Baca nota semula dan cuba lagi nanti!";

        contentDiv.innerHTML = `
            <div class="w-full max-w-sm fade-in text-center flex flex-col items-center">
                <i class="fas fa-medal fa-4x text-school-gold mb-4 drop-shadow-md"></i>
                <h2 class="text-3xl font-bold text-gray-800 mb-1">Tamat!</h2>
                <p class="text-gray-600 mb-6 font-medium">${State.currentLevel} (Bab 1 - Bab 7)</p>
                
                <div class="bg-gray-50 p-6 rounded-2xl border-2 border-gray-100 w-full mb-4 shadow-sm">
                    <p class="text-sm text-gray-500 mb-1 uppercase tracking-widest font-bold">Skor Keseluruhan</p>
                    <p class="text-6xl font-extrabold text-school-blue mb-2">${State.score}<span class="text-3xl text-gray-400">/${totalQ}</span></p>
                    <p class="text-lg font-bold ${percentage >= 50 ? 'text-green-500' : 'text-red-500'}">${percentage}%</p>
                </div>
                <p class="font-medium text-gray-700 italic">${feedbackMsg}</p>
                
                <div id="save-status" class="text-sm text-school-blue mt-4 mb-4 font-semibold flex items-center justify-center gap-2">
                    <i class="fas fa-circle-notch fa-spin"></i> Sedang hantar markah kepada cikgu...
                </div>

                <div class="w-full space-y-3 mt-2">
                    <button onclick="window.shareWhatsApp()" class="w-full bg-[#25D366] text-white p-3 rounded-lg font-bold hover:bg-green-600 transition flex items-center justify-center gap-2 shadow-sm">
                        <i class="fab fa-whatsapp text-xl"></i> WhatsApp Keputusan Ke Guru
                    </button>
                    <button onclick="window.appNav('level-select')" class="w-full bg-white border-2 border-school-blue text-school-blue p-3 rounded-lg font-bold hover:bg-blue-50 transition shadow-sm">
                        Main Tahap Lain
                    </button>
                </div>
            </div>
        `;

        await submitScoreToCloud(totalQ);
    }

    async function submitScoreToCloud(totalQ) {
        const statusDiv = document.getElementById('save-status');
        if (!isFirebaseReady || !auth.currentUser) {
            statusDiv.innerHTML = `<i class="fas fa-exclamation-triangle text-yellow-500"></i> Markah tidak direkod ke awan (offline).`;
            statusDiv.className = "text-sm text-yellow-600 mt-4 mb-4 font-semibold flex items-center justify-center gap-2";
            return;
        }

        try {
            await addDoc(collection(db, 'artifacts', appId, 'public', 'data', 'scores'), {
                studentName: State.student.name,
                className: State.student.className,
                teacherEmail: State.student.teacherEmail,
                level: State.currentLevel,
                score: State.score,
                total: totalQ,
                timestamp: new Date().toISOString()
            });
            statusDiv.innerHTML = `<i class="fas fa-check-circle text-green-500"></i> Markah telah dihantar kepada guru.`;
            statusDiv.className = "text-sm text-green-600 mt-4 mb-4 font-semibold flex items-center justify-center gap-2";
        } catch (error) {
            statusDiv.innerHTML = `<i class="fas fa-times-circle text-red-500"></i> Ralat menghantar markah.`;
            statusDiv.className = "text-sm text-red-600 mt-4 mb-4 font-semibold flex items-center justify-center gap-2";
        }
    }

    window.shareWhatsApp = () => {
        const totalQ = QuizData[State.currentLevel].length;
        const perc = Math.round((State.score/totalQ)*100);
        const msg = `Salam Cikgu. Saya ${State.student.name} dari kelas ${State.student.className} telah menamatkan Ulangkaji Matematik Tingkatan 5 (Bab 1-7).\n\n*Tahap:* ${State.currentLevel}\n*Skor:* ${State.score}/${totalQ} (${perc}%)\n\nTerima kasih Cikgu!`;
        const waUrl = `https://api.whatsapp.com/send?text=${encodeURIComponent(msg)}`;
        window.open(waUrl, '_blank');
    };

    window.appNav = (viewStr) => {
        State.view = viewStr;
        switch(viewStr) {
            case 'role-select': renderRoleSelect(); break;
            case 'teacher-login': renderTeacherLogin(); break;
            case 'student-login': renderStudentLogin(); break;
            case 'level-select': renderLevelSelect(); break;
        }
    };

    window.onload = initAuth;

</script>
</body>
</html>
